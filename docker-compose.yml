name: sofra-restaurant

services:
  postgres:
    image: postgres:17-alpine
    container_name: restaurant-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SOFRA_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: restaurant_demo
      POSTGRES_USER: sofra
      POSTGRES_PASSWORD: ${SOFRA_DB_PASSWORD:?Set SOFRA_DB_PASSWORD in .env}
    volumes:
      - restaurant_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 25

volumes:
  restaurant_postgres_data:
